let fi=-1,qi=0,points=0,answered=false;
const $=id=>document.getElementById(id);
function home(){fi=-1;$('menu').classList.remove('hide');$('game').classList.add('hide');window.scrollTo(0,0)}
function start(i){fi=i;qi=0;points=0;$('menu').classList.add('hide');$('game').classList.remove('hide');$('end').classList.add('hide');$('questionBox').classList.remove('hide');render();window.scrollTo(0,0)}
function restart(){start(fi)}
function render(){answered=false;const f=families[fi],q=f.qs[qi];$('familyLabel').textContent=f.emoji+' '+f.name;$('counter').textContent='Pregunta '+(qi+1)+' de '+f.qs.length;$('score').textContent='⭐ '+points+' punts';$('progress').style.width=(100*qi/f.qs.length)+'%';$('question').textContent=q[0];$('feedback').classList.add('hide');$('next').classList.add('hide');const p=q[3];$('photo').classList.remove('hide');$('photo').src=p===null?familyPhoto:photos[p];$('photo').alt=p===null?'Imatge il·lustrativa de la família d’eines':'Imatge de l’eina';$('options').innerHTML='';q[1].forEach((opt,i)=>{let b=document.createElement('button');b.className='opt';b.textContent=String.fromCharCode(65+i)+'. '+opt;b.onclick=()=>choose(i);$('options').appendChild(b)})}
function choose(i){if(answered)return;answered=true;const q=families[fi].qs[qi],ok=i===q[2];if(ok)points+=100;[...$('options').children].forEach((b,j)=>{b.disabled=true;if(j===q[2])b.classList.add('good');else if(j===i)b.classList.add('bad')});$('score').textContent='⭐ '+points+' punts';$('feedback').classList.remove('hide');$('feedback').innerHTML=(ok?'✅ <strong>Correcte!</strong> ':'💡 <strong>La resposta correcta és '+q[1][q[2]]+'.</strong> ')+q[4];$('next').textContent=qi===families[fi].qs.length-1?'Veure resultat →':'Següent →';$('next').classList.remove('hide')}
function nextQuestion(){qi++;if(qi>=families[fi].qs.length){$('questionBox').classList.add('hide');$('end').classList.remove('hide');$('progress').style.width='100%';$('endTitle').textContent=points===families[fi].qs.length*100?'Perfecte! Has superat la missió!':'Missió completada!';$('endText').textContent='Has aconseguit '+points+' de '+(families[fi].qs.length*100)+' punts.'}else render()}
$('tiles').innerHTML=families.map((f,i)=>'<button class="tile" onclick="start('+i+')"><span class="em">'+f.emoji+'</span><strong>'+f.name+'</strong><small>'+f.qs.length+' preguntes · 2–3 minuts →</small></button>').join('');
start(0);
</script></body></html>
